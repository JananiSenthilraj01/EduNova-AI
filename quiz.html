<script>

/* =========================================================
   API
========================================================= */

const API_URL = "http://127.0.0.1:5000";


/* =========================================================
   QUIZ VARIABLES
========================================================= */

let quizQuestions = [];

let topic = "";

let currentQuestion = 0;

let selectedAnswer = null;

let score = 0;

let isAdaptiveQuiz = false;


/* =========================================================
   ELEMENTS
========================================================= */

const setupSection =
    document.getElementById("setupSection");

const quizSection =
    document.getElementById("quizSection");

const resultSection =
    document.getElementById("resultSection");

const topicInput =
    document.getElementById("topic");

const countInput =
    document.getElementById("count");

const generateButton =
    document.getElementById("generateButton");

const nextButton =
    document.getElementById("nextButton");

const restartButton =
    document.getElementById("restartButton");

const adaptiveButton =
    document.getElementById("adaptiveButton");


/* =========================================================
   READ JSON SAFELY
========================================================= */

async function readJsonResponse(response) {

    const text = await response.text();

    if (!text) {
        throw new Error(
            "The server returned an empty response."
        );
    }

    try {

        return JSON.parse(text);

    } catch (error) {

        console.error(
            "Invalid JSON from server:",
            text
        );

        throw new Error(
            "The server returned an invalid response."
        );
    }
}


/* =========================================================
   VALIDATE QUIZ
========================================================= */

function validateQuiz(quiz) {

    if (!quiz) {
        throw new Error(
            "No quiz data was received."
        );
    }

    if (!Array.isArray(quiz.questions)) {
        throw new Error(
            "The server did not return a question list."
        );
    }

    if (quiz.questions.length === 0) {
        throw new Error(
            "The AI did not generate any questions."
        );
    }

    quiz.questions.forEach(function(question, index) {

        if (!question.question) {

            throw new Error(
                "Question " +
                (index + 1) +
                " is missing its question text."
            );

        }

        if (
            !Array.isArray(question.options) ||
            question.options.length < 2
        ) {

            throw new Error(
                "Question " +
                (index + 1) +
                " has invalid answer options."
            );

        }

        if (
            question.correct_answer === undefined ||
            question.correct_answer === null
        ) {

            throw new Error(
                "Question " +
                (index + 1) +
                " is missing its correct answer."
            );

        }

    });

    return true;
}


/* =========================================================
   START NORMAL QUIZ
========================================================= */

async function startQuiz() {

    topic = topicInput.value.trim();

    const count =
        Number(countInput.value);

    const errorMessage =
        document.getElementById("errorMessage");

    errorMessage.textContent = "";

    if (!topic) {

        errorMessage.textContent =
            "Please enter a topic.";

        topicInput.focus();

        return;
    }

    try {

        generateButton.disabled = true;

        generateButton.textContent =
            "Generating Quiz...";

        isAdaptiveQuiz = false;

        const response = await fetch(
            API_URL + "/quiz",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    topic: topic,
                    count: count
                })
            }
        );

        const data =
            await readJsonResponse(response);

        console.log(
            "Quiz API Response:",
            data
        );

        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Quiz generation failed."
            );
        }

        if (!data.quiz) {

            throw new Error(
                "The server did not return a quiz."
            );
        }

        validateQuiz(data.quiz);

        quizQuestions =
            data.quiz.questions;

        currentQuestion = 0;

        score = 0;

        selectedAnswer = null;

        setupSection.classList.add("hidden");

        resultSection.classList.add("hidden");

        quizSection.classList.remove("hidden");

        document
            .getElementById("topicName")
            .textContent = topic;

        showQuestion();

    } catch (error) {

        console.error(
            "Quiz Error:",
            error
        );

        errorMessage.textContent =
            error.message;

    } finally {

        generateButton.disabled = false;

        generateButton.textContent =
            "Generate Quiz";

    }

}


/* =========================================================
   START ADAPTIVE QUIZ
========================================================= */

async function startAdaptiveQuiz() {

    if (!topic) {
        return;
    }

    try {

        adaptiveButton.disabled = true;

        adaptiveButton.textContent =
            "Generating Adaptive Quiz...";

        const count =
            Number(countInput.value);

        const response = await fetch(
            API_URL + "/adaptive-quiz",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    topic: topic,
                    count: count
                })
            }
        );

        const data =
            await readJsonResponse(response);

        console.log(
            "Adaptive Quiz Response:",
            data
        );

        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Adaptive quiz generation failed."
            );
        }

        if (!data.quiz) {

            throw new Error(
                "The server did not return an adaptive quiz."
            );
        }

        validateQuiz(data.quiz);

        quizQuestions =
            data.quiz.questions;

        currentQuestion = 0;

        score = 0;

        selectedAnswer = null;

        isAdaptiveQuiz = true;

        resultSection.classList.add("hidden");

        quizSection.classList.remove("hidden");

        document
            .getElementById("topicName")
            .textContent =
            topic + " • Adaptive";

        showQuestion();

    } catch (error) {

        console.error(
            "Adaptive Quiz Error:",
            error
        );

        document
            .getElementById("learnerMessage")
            .textContent =
            error.message;

    } finally {

        adaptiveButton.disabled = false;

        adaptiveButton.textContent =
            "Take Adaptive Quiz";

    }

}


/* =========================================================
   SHOW QUESTION
========================================================= */

function showQuestion() {

    const question =
        quizQuestions[currentQuestion];

    if (!question) {

        showResult();

        return;
    }

    selectedAnswer = null;

    document
        .getElementById("questionNumber")
        .textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        quizQuestions.length;

    document
        .getElementById("questionText")
        .textContent =
        question.question || "";

    const optionsContainer =
        document.getElementById(
            "optionsContainer"
        );

    optionsContainer.innerHTML = "";

    const options =
        Array.isArray(question.options)
            ? question.options
            : [];

    options.forEach(function(option) {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className = "option";

        button.textContent = option;

        button.addEventListener(
            "click",
            function() {

                document
                    .querySelectorAll(".option")
                    .forEach(function(item) {

                        item.classList.remove(
                            "selected"
                        );

                    });

                button.classList.add(
                    "selected"
                );

                selectedAnswer =
                    option;

                nextButton.disabled =
                    false;

            }
        );

        optionsContainer.appendChild(
            button
        );

    });

    const progress =
        (
            currentQuestion /
            quizQuestions.length
        ) * 100;

    document
        .getElementById("progressBar")
        .style.width =
        progress + "%";

    nextButton.textContent =
        currentQuestion ===
        quizQuestions.length - 1
            ? "Submit Quiz"
            : "Next";

    nextButton.disabled = true;
}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion() {

    if (selectedAnswer === null) {
        return;
    }

    const question =
        quizQuestions[currentQuestion];

    if (
        question &&
        String(selectedAnswer).trim() ===
        String(question.correct_answer).trim()
    ) {

        score++;

    }

    currentQuestion++;

    if (
        currentQuestion >=
        quizQuestions.length
    ) {

        showResult();

    } else {

        showQuestion();

    }

}


/* =========================================================
   SHOW RESULT
========================================================= */

async function showResult() {

    const total =
        quizQuestions.length;

    if (total === 0) {
        return;
    }

    quizSection.classList.add("hidden");

    resultSection.classList.remove("hidden");

    score =
        Math.max(
            0,
            Math.min(score, total)
        );

    document
        .getElementById("scoreText")
        .textContent =
        score + " / " + total;

    const percentage =
        Math.round(
            (score / total) * 100
        );

    document
        .getElementById("percentageText")
        .textContent =
        percentage + "%";

    let message = "";

    if (percentage >= 80) {

        message =
            "Excellent! You have a strong understanding of this topic.";

    } else if (percentage >= 60) {

        message =
            "Good work! A little more revision can improve your mastery.";

    } else {

        message =
            "This topic needs more revision. EduNova recommends practicing it again.";

    }

    document
        .getElementById("resultMessage")
        .textContent =
        message;


    document
        .getElementById("masteryBox")
        .classList
        .add("hidden");

    document
        .getElementById("weakBox")
        .classList
        .add("hidden");

    document
        .getElementById("recommendationBox")
        .classList
        .add("hidden");

    adaptiveButton.classList.add("hidden");

    document
        .getElementById("learnerMessage")
        .textContent =
        "Updating your learner progress...";


    /* UPDATE LEARNER MODEL */

    try {

        const response =
            await fetch(
                API_URL +
                "/learner/update",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        topic: topic,
                        score: score,
                        total: total
                    })
                }
            );

        const data =
            await readJsonResponse(response);

        console.log(
            "Learner Model Response:",
            data
        );

        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Learner model update failed."
            );
        }

        if (data.success) {

            const mastery =
                Number(data.mastery) || 0;

            showMastery(mastery);

            document
                .getElementById("learnerMessage")
                .textContent =
                "Your learner progress has been updated.";

        } else {

            document
                .getElementById("learnerMessage")
                .textContent =
                "Quiz completed, but learner progress could not be updated.";

        }

    } catch (error) {

        console.error(
            "Learner Model Error:",
            error
        );

        document
            .getElementById("learnerMessage")
            .textContent =
            "Quiz completed. Learner progress could not be updated.";

    }


    await loadWeakTopics();

    await loadRecommendations();

}


/* =========================================================
   SHOW MASTERY
========================================================= */

function showMastery(mastery) {

    document
        .getElementById("masteryBox")
        .classList
        .remove("hidden");

    document
        .getElementById("masteryValue")
        .textContent =
        mastery + "%";

    document
        .getElementById("masteryProgress")
        .style.width =
        Math.min(
            Math.max(mastery, 0),
            100
        ) + "%";

    let status = "";

    if (mastery >= 80) {

        status =
            "Strong mastery — you are doing well in this topic.";

    } else if (mastery >= 60) {

        status =
            "Developing mastery — continue practicing this topic.";

    } else {

        status =
            "Needs revision — review the learning material and try again.";

    }

    document
        .getElementById("masteryStatus")
        .textContent =
        status;

}


/* =========================================================
   LOAD WEAK TOPICS
========================================================= */

async function loadWeakTopics() {

    try {

        const response =
            await fetch(
                API_URL +
                "/learner/weak-topics"
            );

        const data =
            await readJsonResponse(response);

        console.log(
            "Weak Topics:",
            data
        );

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not load weak topics."
            );
        }

        const weakBox =
            document.getElementById(
                "weakBox"
            );

        const container =
            document.getElementById(
                "weakTopicsContainer"
            );

        container.innerHTML = "";

        /*
         * Backend normally returns:
         *
         * [
         *   {
         *      topic: "Query Processing",
         *      mastery: 45
         *   }
         * ]
         *
         * But this also supports the older object format.
         */

        let weakTopics = [];

        if (Array.isArray(data.weak_topics)) {

            weakTopics =
                data.weak_topics;

        } else if (
            data.weak_topics &&
            typeof data.weak_topics === "object"
        ) {

            weakTopics =
                Object.entries(
                    data.weak_topics
                ).map(function(entry) {

                    return {
                        topic: entry[0],
                        mastery: entry[1]
                    };

                });

        }

        if (weakTopics.length === 0) {

            weakBox.classList.add("hidden");

            return;
        }

        weakTopics.forEach(function(item) {

            const topicName =
                item.topic ||
                item.name ||
                "Unknown Topic";

            const mastery =
                Number(item.mastery) || 0;

            const element =
                document.createElement("span");

            element.className =
                "weak-topic";

            element.textContent =
                topicName +
                " • " +
                mastery +
                "%";

            container.appendChild(
                element
            );

        });

        weakBox.classList.remove("hidden");

    } catch (error) {

        console.error(
            "Weak Topics Error:",
            error
        );

    }

}


/* =========================================================
   LOAD RECOMMENDATIONS
========================================================= */

async function loadRecommendations() {

    try {

        const response =
            await fetch(
                API_URL +
                "/learner/recommendations"
            );

        const data =
            await readJsonResponse(response);

        console.log(
            "Recommendations:",
            data
        );

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not load recommendations."
            );
        }

        const recommendationBox =
            document.getElementById(
                "recommendationBox"
            );

        const recommendationText =
            document.getElementById(
                "recommendationText"
            );

        const adaptiveInfo =
            document.getElementById(
                "adaptiveInfo"
            );

        let recommendation = "";

        let adaptiveText = "";


        /* ARRAY FORMAT */

        if (
            Array.isArray(
                data.recommendations
            )
        ) {

            const matching =
                data.recommendations.find(
                    function(item) {

                        return (
                            item.topic ===
                            topic
                        );

                    }
                );

            if (matching) {

                recommendation =
                    matching.recommendation ||
                    matching.message ||
                    matching.action ||
                    "";

                adaptiveText =
                    matching.difficulty
                        ? "Recommended difficulty: " +
                          matching.difficulty
                        : "";

            }

        }


        /* OBJECT FORMAT */

        else if (
            data.recommendations &&
            typeof data.recommendations ===
            "object"
        ) {

            const matching =
                data.recommendations[topic];

            if (matching) {

                if (
                    typeof matching ===
                    "string"
                ) {

                    recommendation =
                        matching;

                } else {

                    recommendation =
                        matching.recommendation ||
                        matching.message ||
                        matching.action ||
                        "";

                    adaptiveText =
                        matching.difficulty
                            ? "Recommended difficulty: " +
                              matching.difficulty
                            : "";

                }

            }

        }


        /* FALLBACK */

        if (!recommendation) {

            const percentage =
                Math.round(
                    (
                        score /
                        quizQuestions.length
                    ) * 100
                );

            if (percentage < 60) {

                recommendation =
                    "Review this topic again and take another adaptive quiz.";

            } else if (percentage < 80) {

                recommendation =
                    "Continue practicing this topic with intermediate questions.";

            } else {

                recommendation =
                    "You have good mastery. Try a more challenging adaptive quiz.";

            }

        }

        recommendationText.textContent =
            recommendation;

        adaptiveInfo.textContent =
            adaptiveText ||
            "EduNova will adjust the next quiz based on your learner progress.";

        recommendationBox.classList.remove(
            "hidden"
        );

        adaptiveButton.classList.remove(
            "hidden"
        );

    } catch (error) {

        console.error(
            "Recommendation Error:",
            error
        );

        const recommendationBox =
            document.getElementById(
                "recommendationBox"
            );

        const recommendationText =
            document.getElementById(
                "recommendationText"
            );

        recommendationText.textContent =
            "Review your current topic and take another quiz to improve your mastery.";

        recommendationBox.classList.remove(
            "hidden"
        );

        adaptiveButton.classList.remove(
            "hidden"
        );

    }

}


/* =========================================================
   RESTART
========================================================= */

function restartQuiz() {

    quizQuestions = [];

    topic = "";

    currentQuestion = 0;

    score = 0;

    selectedAnswer = null;

    isAdaptiveQuiz = false;


    resultSection
        .classList
        .add("hidden");

    quizSection
        .classList
        .add("hidden");

    setupSection
        .classList
        .remove("hidden");


    topicInput.value = "";


    document
        .getElementById("masteryBox")
        .classList
        .add("hidden");

    document
        .getElementById("weakBox")
        .classList
        .add("hidden");

    document
        .getElementById("recommendationBox")
        .classList
        .add("hidden");

    adaptiveButton
        .classList
        .add("hidden");


    document
        .getElementById("masteryValue")
        .textContent =
        "0%";

    document
        .getElementById("masteryProgress")
        .style.width =
        "0%";

    document
        .getElementById("masteryStatus")
        .textContent =
        "";

    document
        .getElementById("learnerMessage")
        .textContent =
        "";

    document
        .getElementById("percentageText")
        .textContent =
        "0%";

    document
        .getElementById("scoreText")
        .textContent =
        "0 / 0";

    document
        .getElementById("errorMessage")
        .textContent =
        "";

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

generateButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        startQuiz();

    }
);


nextButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        nextQuestion();

    }
);


restartButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        restartQuiz();

    }
);


adaptiveButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        startAdaptiveQuiz();

    }
);


/* =========================================================
   ENTER KEY
========================================================= */

topicInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            startQuiz();

        }

    }
);

</script>
