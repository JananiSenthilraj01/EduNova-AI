<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNova AI Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<div class="login-container">
    <h1 class="login-logo">EduNova AI</h1>
    <p class="login-subtitle">AI-Powered Smart Academic & Placement Companion</p>

    <div class="login-card">
        <h2>Student Login</h2>

        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>Register Number</label>
        <input type="text" placeholder="Enter Register Number">

        <label>Department</label>
        <select>
            <option>AIDS</option>
            <option>CSE</option>
            <option>IT</option>
            <option>ECE</option>
        </select>

        <label>Year</label>
        <select>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option selected>3rd Year</option>
            <option>Final Year</option>
        </select>

        <label>Semester</label>
<select id="semester">
    <option>Semester 1</option>
    <option>Semester 2</option>
    <option selected>Semester 3</option>
    <option>Semester 4</option>
    <option>Semester 5</option>
    <option>Semester 6</option>
    <option>Semester 7</option>
    <option>Semester 8</option>
</select>

        <!-- Dream Company -->
        <label>Dream Company</label>
        <select id="dreamCompany">
            <option>TCS</option>
            <option>Infosys</option>
            <option>Google</option>
            <option>Microsoft</option>
            <option>Amazon</option>
            <option>NVIDIA</option>
            <option>Zoho</option>
            <option>Accenture</option>
            <option>Wipro</option>
            <option>Cognizant</option>
        </select>
<button type="button" class="login-btn" onclick="goDashboard()">
    Continue to EduNova AI
</button>

<script>
function goDashboard() {
    window.location.href = "./index.html";
}
</script>

<script>
function goDashboard() {
    window.location.href = "./index.html";
}
</script>

<script>
function goDashboard() {
    window.location.href = "index.html";
}
</script>
    </div>
</div>

<script>
function goDashboard() {
    localStorage.setItem("studentName",
        document.getElementById("name").value);

    localStorage.setItem("dreamCompany",
        document.getElementById("dreamCompany").value);

    window.location.href = "index.html";
}
</script>

</body>
</html>
