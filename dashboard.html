<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduNova AI - Ask Anything</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #202123;
        }

        body {
            overflow: hidden;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        /* =========================
           APP LAYOUT
        ========================== */

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            background: #ffffff;
        }

        /* =========================
           SIDEBAR
        ========================== */

        .sidebar {
            width: 270px;
            height: 100vh;
            background: #f7f8fa;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.25s ease;
            z-index: 100;
        }

        .sidebar-top {
            padding: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            padding: 4px 4px 10px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            object-fit: cover;
        }

        .brand-fallback {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
        }

        .brand-text {
            font-weight: 700;
            font-size: 17px;
        }

        .new-chat-btn {
            width: 100%;
            border: 1px solid #d1d5db;
            background: white;
            color: #202123;
            border-radius: 10px;
            padding: 11px 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 14px;
            transition: 0.2s;
        }

        .new-chat-btn:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
        }

        .history-title {
            padding: 0 18px 8px;
            color: #6b7280;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 12px;
        }

        .history-empty {
            color: #9ca3af;
            font-size: 13px;
            padding: 18px 10px;
            line-height: 1.5;
        }

        .history-item {
            width: 100%;
            border: none;
            background: transparent;
            text-align: left;
            padding: 10px 11px;
            border-radius: 8px;
            cursor: pointer;
            color: #374151;
            margin-bottom: 3px;
            font-size: 13px;
            line-height: 1.35;
        }

        .history-item:hover {
            background: #e9edf3;
        }

        .history-item.active {
            background: #e1e7ef;
            color: #111827;
        }

        .history-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item-date {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 4px;
        }

        .sidebar-bottom {
            border-top: 1px solid #e5e7eb;
            padding: 12px 16px;
        }

        .dashboard-link {
            width: 100%;
            border: none;
            background: transparent;
            text-align: left;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            color: #4b5563;
            font-size: 13px;
        }

        .dashboard-link:hover {
            background: #e9edf3;
        }

        /* =========================
           MAIN
        ========================== */

        .main {
            flex: 1;
            min-width: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .topbar {
            height: 60px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(255,255,255,0.96);
            flex-shrink: 0;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mobile-menu {
            display: none;
            border: none;
            background: transparent;
            font-size: 22px;
            cursor: pointer;
        }

        .page-title {
            font-size: 15px;
            font-weight: 600;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: #4b5563;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
        }

        /* =========================
           CHAT AREA
        ========================== */

        .chat-wrapper {
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .chat-content {
            width: min(900px, 100%);
            height: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .chat-box {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 30px 28px 140px;
            scroll-behavior: smooth;
        }

        /* =========================
           WELCOME
        ========================== */

        .welcome {
            min-height: 65%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 20px;
        }

        .welcome-inner {
            max-width: 650px;
        }

        .welcome-logo {
            width: 56px;
            height: 56px;
            border-radius: 15px;
            margin: 0 auto 16px;
            object-fit: cover;
        }

        .welcome-logo-fallback {
            width: 56px;
            height: 56px;
            border-radius: 15px;
            margin: 0 auto 16px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 26px;
        }

        .welcome h1 {
            margin: 0 0 10px;
            font-size: 30px;
            color: #111827;
        }

        .welcome p {
            margin: 0 auto 26px;
            color: #6b7280;
            font-size: 15px;
            line-height: 1.6;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            text-align: left;
        }

        .suggestion {
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 11px;
            padding: 13px 14px;
            cursor: pointer;
            color: #374151;
            font-size: 13px;
            line-height: 1.4;
            transition: 0.2s;
        }

        .suggestion:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        /* =========================
           MESSAGE
        ========================== */

        .message {
            display: flex;
            gap: 13px;
            margin-bottom: 27px;
            width: 100%;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.user .message-inner {
            max-width: 78%;
            background: #f1f5f9;
            border-radius: 15px;
            padding: 12px 15px;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message.ai .message-inner {
            max-width: 100%;
            width: 100%;
        }

        .avatar {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            margin-top: 1px;
        }

        .user-avatar {
            background: #e5e7eb;
            color: #374151;
        }

        .ai-avatar {
            background: #2563eb;
            color: white;
        }

        .message-body {
            min-width: 0;
        }

        .message-name {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.75;
            color: #202123;
            overflow-wrap: anywhere;
        }

        .message-text p {
            margin: 0 0 12px;
        }

        .message-text p:last-child {
            margin-bottom: 0;
        }

        .message-text h1,
        .message-text h2,
        .message-text h3 {
            margin: 18px 0 9px;
            line-height: 1.3;
            color: #111827;
        }

        .message-text h1 {
            font-size: 21px;
        }

        .message-text h2 {
            font-size: 18px;
        }

        .message-text h3 {
            font-size: 16px;
        }

        .message-text ul,
        .message-text ol {
            margin: 8px 0 14px 22px;
            padding: 0;
        }

        .message-text li {
            margin: 5px 0;
        }

        .message-text strong {
            font-weight: 700;
        }

        .message-text em {
            font-style: italic;
        }

        .inline-code {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 5px;
            padding: 2px 5px;
            font-family: Consolas, monospace;
            font-size: 0.92em;
        }

        .code-block {
            margin: 13px 0;
            border-radius: 9px;
            overflow: hidden;
            background: #111827;
            color: #e5e7eb;
        }

        .code-header {
            padding: 7px 11px;
            background: #1f2937;
            font-size: 11px;
            color: #9ca3af;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copy-code {
            border: none;
            background: transparent;
            color: #cbd5e1;
            cursor: pointer;
            font-size: 11px;
        }

        .code-content {
            padding: 13px;
            margin: 0;
            white-space: pre-wrap;
            overflow-x: auto;
            font-family: Consolas, "Courier New", monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        /* =========================
           SOURCES
        ========================== */

        .sources {
            margin-top: 17px;
            border-top: 1px solid #e5e7eb;
            padding-top: 11px;
        }

        .sources-title {
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            margin-bottom: 6px;
        }

        .source-item {
            font-size: 11px;
            color: #64748b;
            margin: 3px 0;
        }

        /* =========================
           ACTIONS
        ========================== */

        .message-actions {
            display: flex;
            gap: 3px;
            margin-top: 9px;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .message.ai:hover .message-actions {
            opacity: 1;
        }

        .action-btn {
            border: none;
            background: transparent;
            color: #6b7280;
            cursor: pointer;
            padding: 5px 7px;
            border-radius: 6px;
            font-size: 12px;
        }

        .action-btn:hover {
            background: #f1f5f9;
            color: #374151;
        }

        /* =========================
           TYPING
        ========================== */

        .typing {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 5px 0;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #9ca3af;
            animation: typing 1.1s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.45;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* =========================
           FOLLOW-UP QUESTIONS
        ========================== */

        .followups {
            margin: 4px 0 28px 45px;
        }

        .followup-title {
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .followup-list {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .followup-btn {
            border: 1px solid #dbe1e8;
            background: white;
            color: #374151;
            border-radius: 18px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 12px;
        }

        .followup-btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        /* =========================
           COMPOSER
        ========================== */

        .composer-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
            padding: 15px 20px 18px;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0.94) 25%,
                #ffffff 55%
            );
        }

        .composer-container {
            width: min(850px, 100%);
            pointer-events: auto;
        }

        .upload-preview {
            display: none;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #dbe1e8;
            background: white;
            border-radius: 10px;
            padding: 8px 11px;
            margin-bottom: 8px;
            font-size: 12px;
            color: #475569;
        }

        .upload-preview.show {
            display: flex;
        }

        .remove-file {
            border: none;
            background: transparent;
            cursor: pointer;
            color: #64748b;
        }

        .composer {
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(15,23,42,0.08);
            padding: 9px 10px;
        }

        .composer-row {
            display: flex;
            align-items: flex-end;
            gap: 7px;
        }

        .composer textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            min-height: 25px;
            max-height: 150px;
            padding: 6px 7px;
            font-size: 14px;
            line-height: 1.45;
            color: #111827;
            background: transparent;
        }

        .composer textarea::placeholder {
            color: #9ca3af;
        }

        .composer-btn {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 17px;
        }

        .composer-btn:hover {
            background: #f1f5f9;
            color: #334155;
        }

        .send-btn {
            background: #111827;
            color: white;
        }

        .send-btn:hover {
            background: #1f2937;
            color: white;
        }

        .send-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .composer-info {
            display: flex;
            justify-content: space-between;
            padding: 5px 6px 0;
            color: #9ca3af;
            font-size: 10px;
        }

        /* =========================
           TOAST
        ========================== */

        .toast {
            position: fixed;
            right: 22px;
            bottom: 22px;
            background: #111827;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
            transition: 0.2s;
            z-index: 500;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================
           MOBILE
        ========================== */

        .sidebar-overlay {
            display: none;
        }

        @media (max-width: 800px) {

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                box-shadow: 5px 0 25px rgba(0,0,0,0.12);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.25);
                z-index: 90;
                display: none;
            }

            .sidebar-overlay.show {
                display: block;
            }

            .mobile-menu {
                display: block;
            }

            .chat-box {
                padding-left: 16px;
                padding-right: 16px;
                padding-bottom: 145px;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .message.user .message-inner {
                max-width: 88%;
            }

            .followups {
                margin-left: 0;
            }

            .composer-area {
                padding-left: 10px;
                padding-right: 10px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <div class="brand">

                <img
                    src="assets/edunova-logo.png"
                    class="brand-logo"
                    id="brandLogo"
                    alt="EduNova"
                    onerror="this.style.display='none';document.getElementById('brandFallback').style.display='flex';"
                >

                <div
                    class="brand-fallback"
                    id="brandFallback"
                    style="display:none;"
                >
                    E
                </div>

                <div class="brand-text">
                    EduNova AI
                </div>

            </div>

            <button
                class="new-chat-btn"
                id="newChatBtn"
                type="button"
            >
                <span>＋</span>
                <span>New Chat</span>
            </button>

        </div>

        <div class="history-title">
            Chat History
        </div>

        <div
            class="history-list"
            id="historyList"
        >
            <div class="history-empty">
                Loading conversations...
            </div>
        </div>

        <div class="sidebar-bottom">

            <button
                class="dashboard-link"
                id="dashboardBtn"
                type="button"
            >
                ← Back to Dashboard
            </button>

        </div>

    </aside>

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>

    <!-- MAIN CHAT -->
    <main class="main">

        <header class="topbar">

            <div class="topbar-left">

                <button
                    class="mobile-menu"
                    id="mobileMenu"
                    type="button"
                >
                    ☰
                </button>

                <div class="page-title">
                    Ask Anything
                </div>

            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span id="statusText">AI Online</span>
            </div>

        </header>

        <section class="chat-wrapper">

            <div class="chat-content">

                <div
                    class="chat-box"
                    id="chatBox"
                >

                    <!-- WELCOME -->
                    <div
                        class="welcome"
                        id="welcome"
                    >

                        <div class="welcome-inner">

                            <img
                                src="assets/edunova-logo.png"
                                class="welcome-logo"
                                id="welcomeLogo"
                                alt="EduNova"
                                onerror="this.style.display='none';document.getElementById('welcomeFallback').style.display='flex';"
                            >

                            <div
                                class="welcome-logo-fallback"
                                id="welcomeFallback"
                                style="display:none;"
                            >
                                E
                            </div>

                            <h1>
                                What do you want to learn?
                            </h1>

                            <p>
                                Ask EduNova AI anything. Learn from your uploaded
                                materials or explore concepts with an AI learning assistant.
                            </p>

                            <div class="suggestions">

                                <button
                                    class="suggestion"
                                    type="button"
                                    data-question="Explain machine learning in simple words"
                                >
                                    Explain machine learning in simple words
                                </button>

                                <button
                                    class="suggestion"
                                    type="button"
                                    data-question="Create a beginner Python study plan"
                                >
                                    Create a beginner Python study plan
                                </button>

                                <button
                                    class="suggestion"
                                    type="button"
                                    data-question="Explain databases with a simple example"
                                >
                                    Explain databases with a simple example
                                </button>

                                <button
                                    class="suggestion"
                                    type="button"
                                    data-question="Give me five technical interview questions for an AI and Data Science student"
                                >
                                    Give me 5 AI & Data Science interview questions
                                </button>

                                <button
                                    class="suggestion"
                                    type="button"
                                    data-question="Quiz me on Machine Learning"
                                >
                                    Quiz me on Machine Learning
                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

        <!-- COMPOSER -->
        <div class="composer-area">

            <div class="composer-container">

                <div
                    class="upload-preview"
                    id="uploadPreview"
                >
                    <span id="uploadName">
                        File selected
                    </span>

                    <button
                        class="remove-file"
                        id="removeFile"
                        type="button"
                    >
                        ✕
                    </button>
                </div>

                <div class="composer">

                    <div class="composer-row">

                        <button
                            class="composer-btn"
                            id="uploadBtn"
                            type="button"
                            title="Upload PDF"
                        >
                            ＋
                        </button>

                        <input
                            type="file"
                            id="fileInput"
                            accept=".pdf"
                            hidden
                        >

                        <textarea
                            id="questionInput"
                            rows="1"
                            placeholder="Message EduNova AI..."
                        ></textarea>

                        <button
                            class="composer-btn"
                            id="voiceBtn"
                            type="button"
                            title="Voice input"
                        >
                            🎤
                        </button>

                        <button
                            class="composer-btn send-btn"
                            id="sendBtn"
                            type="button"
                            title="Send"
                        >
                            ↑
                        </button>

                    </div>

                    <div class="composer-info">

                        <span>
                            Enter to send · Shift + Enter for new line
                        </span>

                        <span>
                            EduNova AI
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

<div
    class="toast"
    id="toast"
></div>


<script>

    /* ============================================================
       CONFIG
    ============================================================ */

    const API_URL = "http://127.0.0.1:5000";


    /* ============================================================
       DOM
    ============================================================ */

    const chatBox = document.getElementById("chatBox");
    const welcome = document.getElementById("welcome");

    const questionInput = document.getElementById("questionInput");
    const sendBtn = document.getElementById("sendBtn");

    const uploadBtn = document.getElementById("uploadBtn");
    const fileInput = document.getElementById("fileInput");

    const uploadPreview = document.getElementById("uploadPreview");
    const uploadName = document.getElementById("uploadName");
    const removeFile = document.getElementById("removeFile");

    const historyList = document.getElementById("historyList");

    const newChatBtn = document.getElementById("newChatBtn");

    const dashboardBtn = document.getElementById("dashboardBtn");

    const mobileMenu = document.getElementById("mobileMenu");
    const sidebar = document.getElementById("sidebar");

    /* ============================================================
       ESCAPE HTML
    ============================================================ */

    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* ============================================================
       SIMPLE MARKDOWN RENDERER
    ============================================================ */

    function renderMarkdown(text) {

        if (!text) {
            return "";
        }

        let safe = escapeHTML(text);

        const codeBlocks = [];

        safe = safe.replace(
            /```([\w+-]*)\n?([\s\S]*?)```/g,
            function(match, language, code) {

                const id = codeBlocks.length;

                codeBlocks.push({
                    language: language || "code",
                    code: code.trim()
                });

                return `___CODE_BLOCK_${id}___`;
            }
        );


        /* Headings */

        safe = safe.replace(
            /^### (.+)$/gm,
            "<h3>$1</h3>"
        );

        safe = safe.replace(
            /^## (.+)$/gm,
            "<h2>$1</h2>"
        );

        safe = safe.replace(
            /^# (.+)$/gm,
            "<h1>$1</h1>"
        );


        /* Bold */

        safe = safe.replace(
            /\*\*(.+?)\*\*/g,
            "<strong>$1</strong>"
        );


        /* Italic */

        safe = safe.replace(
            /(?<!\*)\*([^*]+)\*(?!\*)/g,
            "<em>$1</em>"
        );


        /* Inline code */

        safe = safe.replace(
            /`([^`]+)`/g,
            '<span class="inline-code">$1</span>'
        );


        /* Bullet lists */

        const lines = safe.split("\n");

        let output = "";

        let insideList = false;

        for (let i = 0; i < lines.length; i++) {

            const line = lines[i];

            if (/^\s*[-*]\s+/.test(line)) {

                if (!insideList) {

                    output += "<ul>";

                    insideList = true;
                }

                output +=
                    "<li>" +
                    line.replace(/^\s*[-*]\s+/, "") +
                    "</li>";

            } else {

                if (insideList) {

                    output += "</ul>";

                    insideList = false;
                }

                if (line.trim() !== "") {

                    if (
                        line.startsWith("<h1>") ||
                        line.startsWith("<h2>") ||
                        line.startsWith("<h3>")
                    ) {

                        output += line;

                    } else {

                        output += "<p>" + line + "</p>";
                    }

                }

            }

        }

        if (insideList) {
            output += "</ul>";
        }


        /* Restore code blocks */

        codeBlocks.forEach((block, index) => {

            const codeHTML = escapeHTML(block.code);

            const codeBlock =
                `<div class="code-block">
                    <div class="code-header">
                        <span>${escapeHTML(block.language)}</span>
                        <button
                            class="copy-code"
                            type="button"
                            onclick="copyCode(this)"
                            data-code="${encodeURIComponent(block.code)}"
                        >
                            Copy
                        </button>
                    </div>
                    <pre class="code-content">${codeHTML}</pre>
                </div>`;

            output = output.replace(
                `<p>___CODE_BLOCK_${index}___</p>`,
                codeBlock
            );

            output = output.replace(
                `___CODE_BLOCK_${index}___`,
                codeBlock
            );

        });


        return output;
    }

    /* ============================================================

    ============================================================ */

    function addFollowUps(question, answer) {

        const lower = (
            question +
            " " +
            answer
        ).toLowerCase();

        let suggestions = [];


        if (
            lower.includes("machine learning") ||
            lower.includes("artificial intelligence") ||
            lower.includes(" ai ")
        ) {

            suggestions = [
                "What is the difference between AI and ML?",
                "Explain supervised and unsupervised learning",
                "Give me a simple ML example",
                "Quiz me on Machine Learning"
            ];

        } else if (
            lower.includes("dbms") ||
            lower.includes("database")
        ) {

            suggestions = [
                "Explain query optimization",
                "What are database joins?",
                "Explain normalization",
                "Quiz me on DBMS"
            ];

        } else if (
            lower.includes("python")
        ) {

            suggestions = [
                "Give me a Python practice problem",
                "Explain Python functions",
                "Create a beginner Python project",
                "Quiz me on Python"
            ];

        } else {

            suggestions = [
                "Explain this with a simple example",
                "Explain this step by step",
                "Give me interview questions",
                "Quiz me on this topic"
            ];

        }


        const container =
            document.createElement("div");

        container.className = "followups";

        container.innerHTML = `

            <div class="followup-title">
                Continue learning
            </div>

            <div class="followup-list">

                ${suggestions.map(item => `
                    <button
                        class="followup-btn"

                        data-question="${escapeHTML(item)}"
                    >
                        ${escapeHTML(item)}
                    </button>
                `).join("")}

        `;

            });


        chatBox.appendChild(container);

        scrollToBottom();
    }

    /* ============================================================
       SEND MESSAGE
    ============================================================ */

    async function sendMessage(
        providedQuestion = null,
        isRegenerate = false
    ) {

        if (isSending) {
            return;
        }


        const question =
            providedQuestion !== null
                ? providedQuestion.trim()
                : questionInput.value.trim();


        if (!question) {
            return;
        }


        isSending = true;

        sendBtn.disabled = true;


        if (!isRegenerate) {

            addUserMessage(question);

            currentConversation.push({
                role: "user",
                content: question
            });

            questionInput.value = "";

            autoResizeTextarea();

        }


        lastQuestion = question;


        const typing =
            addTypingMessage();


        try {

            const response =
                await fetch(
                    `${API_URL}/ask`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            question: question,
                            provider: "groq"
                        })
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `Server returned ${response.status}`
                );

            }


            const data =
                await response.json();


            removeTypingMessage();


            if (!data || data.success === false) {

                throw new Error(
                    data?.error ||
                    "AI could not answer"
                );

            }


            const answer =
                data.answer ||
                data.response ||
                "I couldn't generate an answer.";


            const sources =
                data.sources ||
                data.source ||
                [];


            addAIMessage(
                answer,
                Array.isArray(sources)
                    ? sources
                    : []
            );


            currentConversation.push({
                role: "assistant",
                content: answer,
                sources: sources
            });


            addFollowUps(
                question,
                answer
            );


            /*
             IMPORTANT:

             We DO NOT redirect.
             We DO NOT reload the page.
             We DO NOT navigate to dashboard.

             The answer is directly added to #chatBox.
            */


            saveLocalConversation();


        } catch (error) {

            removeTypingMessage();


            console.error(
                "Chat error:",
                error
            );


            addAIMessage(
                "I couldn't connect to EduNova AI right now. Please make sure the backend is running and try again."
            );

            showToast(
                "Could not connect to AI"
            );

        } finally {

            isSending = false;

            sendBtn.disabled = false;

            questionInput.focus();

            scrollToBottom();

        }

    }

                this.files[0];

            if (!file) {
                return;
            }


            if (
                file.type !== "application/pdf" &&
                !file.name.toLowerCase().endsWith(".pdf")
            ) {

                showToast(
                    "Please select a PDF file"
                );

                fileInput.value = "";

                return;

                );

                fileInput.value = "";

                return;
            }


            selectedFile = file;

            uploadName.textContent =

            uploadPreview.classList.add(
                "show"
            );


            try {

                const formData =
                    new FormData();

                formData.append(

                    file

                showToast(
                    "Uploading PDF..."
                );


                const response =
                    await fetch(
                        `${API_URL}/upload`,

                            method: "POST",
                            body: formData
                        }
                    );


                const data =

                if (

                    throw new Error(

    /* ============================================================

    ============================================================ */

    async function loadHistory() {

        try {

            const response =
                await fetch(
                    `${API_URL}/history`,
                    {
                        method: "GET"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "History request failed"
                );

            }


            const data =
                await response.json();


            /*
             Backend versions may return:

             data.history
             data.chats
             or directly an array.
            */

            let history =
                data.history ||
                data.chats ||
                data;


            if (!Array.isArray(history)) {
                history = [];
            }


            renderHistory(
                history
            );


        } catch (error) {

            console.error(
                "History error:",
                error
            );


            historyList.innerHTML = `

                <div class="history-empty">
                    No saved conversations found.
                </div>
            `;

        }

    }


    /* ============================================================
       HISTORY TITLE
    ============================================================ */

    function getHistoryTitle(item) {

        if (!item) {
            return "New conversation";
        }


        if (item.title) {
            return item.title;
        }


        if (item.question) {
            return item.question;
        }


        if (item.message) {
            return item.message;
        }


        if (
            Array.isArray(item.messages) &&
            item.messages.length
        ) {

            const firstUser =
                item.messages.find(
                    message =>
                        message.role === "user" ||
                        message.type === "user"
                );

            if (firstUser) {

                return (
                    firstUser.content ||
                    firstUser.message ||
                    "Conversation"
                );

            }

        }


        return "Conversation";

    }


    /* ============================================================
       HISTORY DATE
    ============================================================ */

    function getHistoryDate(item) {

        const dateValue =
            item?.timestamp ||
            item?.created_at ||
            item?.date ||
            item?.createdAt;


        if (!dateValue) {
            return "";
        }


        try {

            return new Date(
                dateValue
            ).toLocaleDateString(
                "en-IN",
                {
                    day: "numeric",
                    month: "short"
                }
            );

        } catch {

            return "";

        }

    }


    /* ============================================================
       RENDER HISTORY
    ============================================================ */

    function renderHistory(history) {

        historyList.innerHTML = "";


        if (!history.length) {

            historyList.innerHTML = `

                <div class="history-empty">
                    Your previous conversations will appear here.
                </div>
            `;

            return;
        }


        history
            .slice()
            .reverse()
            .forEach(
                (item, index) => {

                    const button =
                        document.createElement("button");

                    button.className =
                        "history-item";


                    const title =
                        getHistoryTitle(item);

                    const date =
                        getHistoryDate(item);


                    button.innerHTML = `

                        <div class="history-item-title">
                            ${escapeHTML(title)}
                        </div>

                        ${
                            date
                                ? `
                                    <div class="history-item-date">
                                        ${escapeHTML(date)}
                                    </div>
                                `
                                : ""
                        }
                    `;


                    button.addEventListener(
                        "click",
                        () => {

                            openHistoryConversation(
                                item
                            );

                        }
                    );


                    historyList.appendChild(
                        button
                    );

                }
            );

    }


    /* ============================================================
       EXTRACT MESSAGES FROM HISTORY ITEM
    ============================================================ */

    function extractMessages(item) {

        if (!item) {
            return [];
        }


        if (Array.isArray(item.messages)) {

            return item.messages;

        }


        if (Array.isArray(item.conversation)) {

            return item.conversation;

        }


        if (
            item.question &&
            (
                item.answer ||
                item.response
            )
        ) {

            return [
                {
                    role: "user",
                    content: item.question
                },

                {
                    role: "assistant",
                    content:
                        item.answer ||
                        item.response,

                    sources:
                        item.sources ||
                        []
                }
            ];

        }


        if (
            item.user &&
            item.ai
        ) {

            return [
                {
                    role: "user",
                    content: item.user
                },

                {
                    role: "assistant",
                    content: item.ai
                }
            ];

        }


        return [];

    }


    /* ============================================================
       OPEN HISTORY CONVERSATION
    ============================================================ */

    function openHistoryConversation(item) {

        const messages =
            extractMessages(item);


        if (!messages.length) {

            showToast(
                "This conversation could not be loaded."
            );

            return;

        }


        currentHistoryId =
            item.id ||
            item.chat_id ||
            item.conversation_id ||
            null;


        currentConversation = [];


        chatBox.innerHTML = "";


        messages.forEach(
            message => {

                const role =
                    message.role ||
                    message.type;


                const content =
                    message.content ||
                    message.message ||
                    message.text ||
                    "";


                if (!content) {
                    return;
                }


                if (
                    role === "user" ||
                    role === "human"
                ) {

                    addUserMessage(
                        content
                    );

                    currentConversation.push({
                        role: "user",
                        content: content
                    });

                } else {

                    addAIMessage(
                        content,
                        message.sources ||
                        message.source ||
                        []
                    );

                    currentConversation.push({
                        role: "assistant",
                        content: content,
                        sources:
                            message.sources ||
                            []
                    });

                }

            }
        );


        hideWelcome();


        /*
         IMPORTANT:

         We stay on chat.html.

         No window.location change.
         No dashboard navigation.
        */

        closeMobileSidebar();

        scrollToBottom();

        showToast(
            "Conversation opened"
        );

    }


    /* ============================================================
       DASHBOARD
    ============================================================ */

    dashboardBtn.addEventListener(
        "click",
        () => {

            window.location.href =
                "dashboard.html";

        }
    );


    /* ============================================================
       MOBILE SIDEBAR
    ============================================================ */

    mobileMenu.addEventListener(
        "click",
        () => {

            sidebar.classList.add(
                "open"
            );

            sidebarOverlay.classList.add(
                "show"
            );

        }
    );


    sidebarOverlay.addEventListener(
        "click",
        closeMobileSidebar
    );


    function closeMobileSidebar() {

        sidebar.classList.remove(
            "open"
        );

        sidebarOverlay.classList.remove(
            "show"
        );

    }


    /* ============================================================
       BACKEND STATUS
    ============================================================ */

    async function checkBackend() {

        try {

            const response =
                await fetch(
                    `${API_URL}/status`,
                    {
                        method: "GET"
                    }
                );


            if (response.ok) {

                document.getElementById(
                    "statusText"
                ).textContent =
                    "AI Online";

            } else {

                throw new Error();

            }

        } catch {

            document.getElementById(
                "statusText"
            ).textContent =
                "AI Offline";

        }

    }


    /* ============================================================
       INITIALIZE
    ============================================================ */

    document.addEventListener(
        "DOMContentLoaded",
        async function() {

            await checkBackend();

            await loadHistory();

            questionInput.focus();

        }
    );

</script>

</body>
