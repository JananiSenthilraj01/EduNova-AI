<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNova AI Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">EduNova AI</div>
    <p>AI Chat Assistant</p>
</header>

<div class="chat-container" id="chatBox">

    <div class="ai-message">
        Welcome to EduNova AI. How can I help you today?
    </div>

    <div class="user-message">
        Help me prepare for Data Structures.
    </div>

    <div class="ai-message">
        I can explain Data Structures, provide notes, quizzes, and interview questions.
    </div>

</div>

<div class="chat-input">
    <input type="text" id="userInput" placeholder="Type your question...">
    <button onclick="sendMessage()">Send</button>
</div>

<script src="script.js"></script>

</body>
</html>
