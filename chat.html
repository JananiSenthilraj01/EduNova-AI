<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduNova AI - Ask Anything</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7ff;
            min-height: 100vh;
        }

        header {
            background: #ffffff;
            padding: 20px 40px;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #4f46e5;
        }

        header p {
            margin-top: 5px;
            color: #64748b;
        }

        .chat-container {
            width: 90%;
            max-width: 900px;
            height: 65vh;
            margin: 30px auto 20px;
            background: white;
            border-radius: 18px;
            padding: 25px;
            overflow-y: auto;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .ai-message,
        .user-message {
            max-width: 75%;
            padding: 14px 18px;
            margin-bottom: 15px;
            border-radius: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .ai-message {
            background: #eef2ff;
            color: #1e293b;
            margin-right: auto;
        }

        .user-message {
            background: #4f46e5;
            color: white;
            margin-left: auto;
        }

        .chat-input {
            width: 90%;
            max-width: 900px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .chat-input input:focus {
            border-color: #4f46e5;
        }

        .chat-input button {
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .chat-input button:hover {
            background: #4338ca;
        }

        .chat-input button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .typing {
            color: #64748b;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .chat-container {
                width: 95%;
                height: 65vh;
            }

            .chat-input {
                width: 95%;
            }

            .ai-message,
            .user-message {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">EduNova AI</div>
        <p>Personalized Learning Assistant</p>
    </header>

    <div class="chat-container" id="chatBox">

        <div class="ai-message">
            👋 Welcome to EduNova AI!

            Ask me anything you want to learn. I can explain concepts, give examples, simplify difficult topics, and help you understand new subjects.
        </div>

    </div>

    <div class="chat-input">

        <input
            type="text"
            id="userInput"
            placeholder="Ask anything..."
            autocomplete="off"
        >

        <button id="sendButton" onclick="sendMessage()">
            Send
        </button>

    </div>


    <script>

        const API_URL = "http://127.0.0.1:5000";

        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");
        const sendButton = document.getElementById("sendButton");


        // Add message to chat
        function addMessage(message, type) {

            const messageDiv = document.createElement("div");

            messageDiv.className = type === "user"
                ? "user-message"
                : "ai-message";

            messageDiv.textContent = message;

            chatBox.appendChild(messageDiv);

            chatBox.scrollTop = chatBox.scrollHeight;
        }


        // Send message to Gemini
        async function sendMessage() {

            const question = userInput.value.trim();

            if (question === "") {
                return;
            }

            // Show user's message
            addMessage(question, "user");

            // Clear input
            userInput.value = "";

            // Disable button
            sendButton.disabled = true;
            sendButton.textContent = "Thinking...";


            // Temporary AI message
            const typingMessage = document.createElement("div");

            typingMessage.className = "ai-message typing";
            typingMessage.textContent = "EduNova AI is thinking...";

            chatBox.appendChild(typingMessage);

            chatBox.scrollTop = chatBox.scrollHeight;


            try {

                const response = await fetch(
                    API_URL + "/ask",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            question: question,
                            provider: "gemini"
                        })
                    }
                );


                const data = await response.json();


                // Remove typing message
                typingMessage.remove();


                if (!response.ok) {

                    addMessage(
                        data.answer || "Something went wrong.",
                        "ai"
                    );

                    return;
                }


                // Show Gemini response
                addMessage(
                    data.answer || "I couldn't generate an answer.",
                    "ai"
                );


            } catch (error) {

                typingMessage.remove();

                addMessage(
                    "I couldn't connect to the EduNova AI backend. Please make sure Flask is running at http://127.0.0.1:5000",
                    "ai"
                );

                console.error("Backend connection error:", error);

            } finally {

                sendButton.disabled = false;
                sendButton.textContent = "Send";

                userInput.focus();
            }
        }


        // Press Enter to send
        userInput.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        });

    </script>

</body>

</html>
